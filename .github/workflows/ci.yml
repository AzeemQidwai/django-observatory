name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "4.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.10", django: "5.2" }
          - { python: "3.13", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.13", django: "6.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "Django~=${{ matrix.django }}.0"
      - name: System checks and migrations are up to date
        run: |
          python -m django check --settings=tests.settings
          python -m django makemigrations --check --dry-run --settings=tests.settings
      - name: Tests
        run: python -m django test tests --settings=tests.settings

  optional-dependencies:
    name: With psutil and OpenTelemetry installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "Django~=5.2.0" psutil opentelemetry-api requests httpx
      - run: python -m django test tests --settings=tests.settings

  windows:
    # The primary deployment target.
    name: Windows / Python 3.12 / Django 5.2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "Django~=5.2.0"
      - run: python -m django test tests --settings=tests.settings

  package:
    name: Build and validate the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and works in a clean project
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/django-admin startproject fresh && cd fresh
          sed -i "s/    'django.contrib.staticfiles',/    'django.contrib.staticfiles',\n    'django_observatory',/" fresh/settings.py
          sed -i "s/    'django.middleware.common.CommonMiddleware',/    'django.middleware.common.CommonMiddleware',\n    'django_observatory.middleware.ObservabilityMiddleware',/" fresh/settings.py
          /tmp/clean/bin/python manage.py check
          /tmp/clean/bin/python manage.py migrate
          /tmp/clean/bin/python manage.py observability_test
