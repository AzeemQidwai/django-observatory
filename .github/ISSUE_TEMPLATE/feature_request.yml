name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: It works offline and needs no extra infrastructure (Redis, Docker, a SaaS, a CDN)
        - label: It does not add a mandatory dependency beyond Django
